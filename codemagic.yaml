workflows:
  release:
    name: Release Build
    environment:
      vars:
        FLUTTER_VERSION: 3.41.9  # Ajustez si nécessaire
        # URL du serveur (Vercel). C'est LE point d'entrée de la NOUVELLE
        # config :
        #   - proxy de paiement ENKAP   → POST /enkap/order (+ setup returnUrl)
        #   - envoi d'emails (mobile)   → POST /email/send (SMTP côté serveur)
        #   - intentions d'abonnement   → POST /enkap/register
        # Injectée via --dart-define et lue par ConfigService.apiBaseUrl
        # (priorité --dart-define, puis .env, puis défaut).
        #
        # ⚠️ AUCUN secret (ENKAP_CONSUMER_*, SMTP_*) n'est embarqué dans l'APK :
        # ils restent dans les variables d'environnement de Vercel. Configurer
        # SMTP_HOST/PORT/USERNAME/PASSWORD/FROM_EMAIL côté Vercel.
        API_BASE_URL: "https://server-xi-two-23.vercel.app"
      flutter: stable
    # 🔁 Sync GitHub : le build se déclenche automatiquement à chaque push
    # de tag v* (ex. v1.0.1) sur le dépôt (webhook Codemagic → GitHub).
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts:
      - name: Décoder le Keystore JKS
        script: |
          echo "Recréation du fichier de clé..."
          echo $KEYSTORE_BASE64 | base64 --decode > android/app/upload-keystore.jks

      - name: Générer local.properties pour Gradle
        script: |
          echo "Génération de local.properties..."
          echo "flutter.sdk=$FCI_FLUTTER_HOME" > android/local.properties
          echo "release.keystore.password=$KEYSTORE_PASSWORD" >> android/local.properties
          echo "release.key.alias=$KEY_ALIAS" >> android/local.properties
          echo "release.key.password=$KEY_PASSWORD" >> android/local.properties

      # - name: Set up google-services.json
      #   script: |
      #     echo "Génération de google-services.json..."
      #     echo $ANDROID_FIREBASE_JSON_BASE64 | base64 --decode > android/app/google-services.json

      - name: Fix Android SDK 37 directory path
        script: |
          ln -s /usr/local/share/android-sdk/platforms/android-37.0 /usr/local/share/android-sdk/platforms/android-37

      - name: Installer les dépendances
        script: |
          flutter pub get

      - name: Générer les fichiers de build (Build Runner)
        script: |
          dart run build_runner build --delete-conflicting-outputs
          
      # Active la correction automatique des membres dépréciés
      - name: Fix deprecated code automatically
        script: |
          dart fix --apply
     
      - name: Analyse statique (gardé 0 erreur / 0 warning)
        script: |
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      # - name: Update Gradle Wrapper
      #   script: |
      #     cd android  
      #     gradle wrapper --gradle-version 8.14.0 

      - name: Disabled Android newDsl
        script: |
          echo "android.newDsl=false" >> android/gradle.properties

      - name: Builder l'APK Release (obfusqué)
        script: |
          # 🛡️ Obfuscation du code Dart (anti-rétro-ingénierie). Les symboles
          # sont sauvegardés dans build/symbols pour désobfusquer les crashs.
          # 🔑 API_SECRET_KEY (variable d'environnement CodeMagic, même valeur
          # que sur Vercel) : injectée via --dart-define, envoyée dans l'entête
          # x-api-key de chaque appel serveur. SANS elle, le serveur renvoie
          # 401 sur toutes les API privées.
          flutter build apk --release \
            --android-skip-build-dependency-validation \
            --dart-define="API_BASE_URL=$API_BASE_URL" \
            --dart-define="API_SECRET_KEY=$API_SECRET_KEY" \
            --obfuscate \
            --split-debug-info=build/symbols/apk

      - name: Builder l'App Bundle (AAB) (obfusqué)
        script: |
          # ⚠️ Même flag que l'APK ci-dessus : Flutter 3.41 exige Gradle >= 8.14,
          # notre wrapper est en 8.7 (largement suffisant pour AGP 8.6.0 — cf.
          # APK buildé avec succès). Le flag saute la validation de version.
          flutter build appbundle --release \
            --android-skip-build-dependency-validation \
            --dart-define="API_BASE_URL=$API_BASE_URL" \
            --dart-define="API_SECRET_KEY=$API_SECRET_KEY" \
            --obfuscate \
            --split-debug-info=build/symbols/aab

      - name: Vérifier la signature
        script: |
          if [ -f "android/app/upload-keystore.jks" ]; then
            echo "✅ Keystore trouvé"
          else
            echo "⚠️ Keystore non trouvé, APK non signé"
          fi

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
      # 🛡️ Symboles de désobfuscation (à conserver précieusement pour lire
      # les traces de crash d'une build obfusquée).
      - build/symbols/**

    publishing:
      # 🎯 Publication automatique sur la GitHub Release du tag.
      # draft:false / prerelease:false est OBLIGATOIRE : la page /download du
      # serveur Vercel interroge l'API `releases/latest`, qui ignore les
      # drafts et les prereleases. C'est CE publish qui alimente le bouton
      # Android de https://server-xi-two-23.vercel.app/download
      github_releases:
        repository: punch-bite/Noi-Ohada-Invoice-Pro
        tag: $CM_TAG
        release_name: "Noi OHADA Invoice Pro – Release $CM_TAG"
        description: |
          ## 📱 Noi OHADA Invoice Pro ($CM_TAG)

          ### 📦 Contenu
          - **APK** (installation directe sur Android) — signature de prod
          - **AAB** (bundle à soumettre au Play Store)
          - **Symboles** de désobfuscation (facultatif, pour lire les crashs)

          ### 🛠️ Installation (testeurs)
          1. Télécharger le fichier `.apk`
          2. L'ouvrir sur un appareil Android (autoriser « sources inconnues »)
          3. Les données restent accessibles via le compte

          ---
          *Généré automatiquement par Codemagic.*
        draft: false
        prerelease: false
        artifact_paths:
          - "build/app/outputs/flutter-apk/*.apk"
          - "build/app/outputs/bundle/release/*.aab"
          - "build/symbols/**"
        credentials:
          username: $GITHUB_USERNAME
          personal_access_token: $GITHUB_TOKEN

      email:
        recipients:
          - nixmmobilier@gmail.com
        notify:
          success: true
          failure: true

  ios:
    name: Build iOS (IPA Ad Hoc — iPhone test)
    environment:
      vars:
        FLUTTER_VERSION: 3.41.9
        # Même serveur que Android : proxy ENKAP, emails, abonnements…
        API_BASE_URL: "https://server-xi-two-23.vercel.app"
      flutter: stable
    scripts:
      - name: Signing iOS (automatique CodeMagic)
        script: |
          # La signature iOS est gérée par CodeMagic (« iOS code signing »
          # réglé sur Automatic dans l'application). Prérequis :
          #   1) un compte Apple Developer (programme $99/an)
          #   2) CodeMagic → App settings → iOS code signing → Automatic,
          #      connecté à votre compte Apple Developer (Apple API Key)
          # Aucun secret (certificats/provisioning) n'est embarqué ici.
          echo "Prêt pour le build iOS."
      - name: Installer les dépendances
        script: |
          flutter pub get
      - name: Générer les fichiers de build (Build Runner)
        script: |
          dart run build_runner build --delete-conflicting-outputs
      - name: Analyse statique
        script: |
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Builder l'IPA (release, export ad hoc pour testeurs)
        script: |
          flutter build ipa --release \
            --dart-define="API_BASE_URL=$API_BASE_URL" \
            --dart-define="API_SECRET_KEY=$API_SECRET_KEY" \
            --export-method=ad-hoc \
            --obfuscate \
            --split-debug-info=build/symbols/ios
    artifacts:
      - build/ios/ipa/*.ipa
      # Symboles de désobfuscation (crashs) à conserver
      - build/symbols/**

    publishing:
      email:
        recipients:
          - nixmmobilier@gmail.com
        notify:
          success: true
          failure: true
