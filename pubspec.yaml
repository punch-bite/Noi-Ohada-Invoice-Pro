name: noi_ohada_invoice_pro
description: "Gestion de factures conforme OHADA"
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.5.0 <4.0.0' # Flutter 3.41 nécessite un SDK Dart récent

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ═══════════════════════════════════════════════════════════════════
  #  ARCHITECTURE & STATE MANAGEMENT
  # ═══════════════════════════════════════════════════════════════════
  provider: ^6.1.2
  go_router: ^14.6.0
  json_annotation: ^4.9.0

  # ═══════════════════════════════════════════════════════════════════
  #  FIREBASE (compatible Flutter 3.41)
  # ═══════════════════════════════════════════════════════════════════
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.2.10

  # ⚠️ GOOGLE SIGN-IN — FIGÉ < 7.0.0
  #    La v7 change RADICALEMENT l'API (plus de singleton, `authenticate()`
  #    remplace `signIn()`, `authorizationClient` pour les tokens).
  #    `drive_sync_service.dart` et `auth_service.dart` utilisent l'API v6.x.
  #    → Ne PAS monter au-delà de 6.x sans refactor du Drive sync.
  google_sign_in: '>=6.2.2 <7.0.0'
  googleapis: ^13.0.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.1

  # ═══════════════════════════════════════════════════════════════════
  #  DATABASE & LOCAL STORAGE
  # ═══════════════════════════════════════════════════════════════════
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # ═══════════════════════════════════════════════════════════════════
  #  OHADA COMPLIANCE & BUSINESS LOGIC
  # ═══════════════════════════════════════════════════════════════════
  intl: ^0.19.0
  uuid: ^4.5.1
  decimal: ^2.3.3 # RECOMMANDÉ : remplacer les doubles par Decimal en compta OHADA

  # ═══════════════════════════════════════════════════════════════════
  #  PDF & REPORTING
  # ═══════════════════════════════════════════════════════════════════
  pdf: ^3.12.0
  printing: ^5.14.0
  csv: ^6.0.0
  fl_chart: ^0.69.0
  qr: ^3.0.1

  # ═══════════════════════════════════════════════════════════════════
  #  UTILITAIRES & SÉCURITÉ
  # ═══════════════════════════════════════════════════════════════════
  dart_dash_otp: ^2.0.0
  crypto: ^3.0.6
  mailer: ^6.4.0
  http: ^1.2.2
  dio: ^5.7.0
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.0
  path_provider: ^2.0.12
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  flutter_dotenv: ^6.0.1

  # ⚠️ local_auth — caret ajouté pour recevoir les patchs automatiques.
  #    Si tu as volontairement figé à 3.0.2 pour une raison spécifique,
  #    tu peux remettre `3.0.2` sans caret.
  local_auth: ^3.0.2

  flutter_contacts: ^2.0.0

  # ═══════════════════════════════════════════════════════════════════
  #  UI
  # ═══════════════════════════════════════════════════════════════════
  fluttertoast: ^8.2.14
  flutter_slidable: ^3.1.1
  shimmer: ^3.0.0
  webview_flutter: ^4.8.0
  flutter_staggered_animations: ^1.1.1
  simple_animations: ^5.0.3
  flutter_animate: ^4.5.0
  share_plus: ^12.0.2
  url_launcher: ^6.3.1
  flutter_local_notifications: ^22.3.0
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.3.3
  hive_generator: ^2.0.1
  json_serializable: 6.8.0
  mockito: ^5.4.4
  flutter_native_splash: ^2.3.8

  # ⚠️ FAKE FIREBASE CORE (Pigeon) — requis pour les tests de widgets
  #    Firebase (dépendance de dev uniquement).
  firebase_core_platform_interface: ^6.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # ⚠️ NE PAS embarquer .env ici : il contient des secrets (SMTP, NochPay…).
    #    Les secrets sont injectés au build via --dart-define (voir README).
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
    - assets/fonts/Roboto-Medium.ttf
    - assets/fonts/Roboto-Condensed.ttf
    - assets/fonts/Roboto-Light.ttf
    - assets/fonts/Manrope.ttf
    - assets/fonts/WorkSans.ttf

  fonts:
    # ─── NoiPolice (bundle Roboto) — utilisée par défaut ───
    - family: NoiPolice
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Medium.ttf
        - asset: assets/fonts/Roboto-Condensed.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300

    # ─── Manrope — utilisée pour les titres du workspace v6 et l'aperçu v5 ───
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf

    # ─── WorkSans — utilisée pour le corps de texte (WYSIWYG v4) ───
    - family: WorkSans
      fonts:
        - asset: assets/fonts/WorkSans.ttf