<html lang="fr"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-surface": "#1b1b23", "on-primary": "#ffffff", "inverse-on-surface": "#f3effb", "surface-container": "#f0ecf8", "primary-fixed": "#e3dfff", "error": "#ba1a1a", "secondary-fixed-dim": "#d2bbff", "surface-container-lowest": "#ffffff", "surface-container-low": "#f6f2fe", "primary-fixed-dim": "#c3c0ff", "tertiary": "#692400", "surface-container-highest": "#e4e1ed", "on-tertiary-fixed": "#360f00", "inverse-surface": "#302f39", "surface-variant": "#e4e1ed", "secondary-fixed": "#eaddff", "tertiary-fixed": "#ffdbcd", "error-container": "#ffdad6", "surface-bright": "#fcf8ff", "primary": "#2a14b4", "surface-dim": "#dcd8e4", "on-primary-container": "#c1beff", "on-surface-variant": "#464554", "surface-container-high": "#eae6f3", "on-secondary": "#ffffff", "background": "#fcf8ff", "on-secondary-fixed": "#25005a", "secondary": "#712ae2", "secondary-container": "#8a4cfc", "on-primary-fixed": "#100069", "outline": "#777586", "surface": "#fcf8ff", "on-tertiary-container": "#ffb393", "on-primary-fixed-variant": "#372abf", "on-tertiary": "#ffffff", "tertiary-fixed-dim": "#ffb597", "on-error": "#ffffff", "tertiary-container": "#8f3400", "surface-tint": "#5148d7", "on-tertiary-fixed-variant": "#7d2d00", "on-secondary-container": "#fffbff", "on-secondary-fixed-variant": "#5a00c6", "on-background": "#1b1b23", "outline-variant": "#c7c4d7", "primary-container": "#4338ca", "on-error-container": "#93000a", "inverse-primary": "#c3c0ff" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "unit": "4px", "container-padding": "24px", "card-gap": "20px", "gutter": "16px" }, "fontFamily": { "label-md": ["Roboto Flex"], "body-md": ["Roboto Flex"], "headline-xl": ["Roboto Flex"], "title-md": ["Roboto Flex"], "body-lg": ["Roboto Flex"], "headline-lg-mobile": ["Roboto Flex"], "headline-lg": ["Roboto Flex"] }, "fontSize": { "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-xl": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800" }], "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }], "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }] } } } };</script><style>@layer base { .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } } .glass-effect { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); background: rgba(252, 248, 255, 0.8); } </style></head><body class="bg-background font-body-md text-on-background min-h-screen"><header class="fixed top-0 w-full z-40 glass-effect pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-gutter flex items-center justify-between"><div class="flex items-center gap-3"><button class="w-10 h-10 flex items-center justify-center" onclick="history.back()"><span class="material-symbols-outlined text-on-surface">arrow_back</span></button><img alt="Logo" class="h-6 w-auto" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCevokFTsxTx1AkQ_PIXsTx6b7vDSAcvUAYBHSIyuem6iBMaispR7xT1c2YPpVL6mZm8baE3EuYxhaXoB58axZNldSdnh86EgLXRmaXrpCREp6IE9KhTprOiN3IxivdwRIXqiAWXErgE7HXJFqK0LfLsNHL6pAeUvlVavbfiEJGP-MZqnABywaAhAVnAgDxM2F03VEVCPzwUaT9VvJGMENH7qJV_0smdcRe0y5VL9GTvNe1B_2l7vkEag"/><span class="font-title-md text-title-md text-on-surface">Create Invoice</span></div><img alt="Profile" class="w-8 h-8 rounded-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBCxRp3OXUzJxHa38bAfdDV8rFXOE04V7dsw1_DvkM3_BZHFI1PWBkYzDAMN0Bi5cFjBQD24b0RwUTbxlQHPNMslwZV58c_mz2xO-G7H7-MkO37Ke6fCKpOWWvuPRjR6gPihp_3T6UV-uvUSxx2BgmX-wKGx1dF6j-rBRsKfGwt9pH93wgx-OuP01Eei0GlhZKwFZXoLDsajPRve7_wyOg3orQA9uuacs9gcUWAq2ZgCX3wI62zgmScWQ"/></div></header><main class="relative pt-16 px-container-padding min-h-screen bg-surface"><div class="flex flex-col w-full px-container-padding pb-[80px] gap-6" id="invoice-app">
<div class="flex flex-col gap-2 mt-4">
<h1 class="text-headline-lg-mobile text-on-surface font-headline-lg-mobile">Créer un document</h1>
<p class="text-body-md text-on-surface-variant font-body-md">Saisissez les détails de la transaction.</p>
</div>
<!-- Type Switcher -->
<div class="flex bg-surface-container-highest rounded-full p-1 relative w-full h-12 shadow-sm">
<div class="absolute w-[calc(50%-4px)] h-[calc(100%-8px)] top-1 left-1 bg-surface rounded-full shadow-sm transition-transform duration-300 ease-in-out pointer-events-none" id="type-indicator"></div>
<button class="type-btn flex-1 flex items-center justify-center text-label-md font-label-md text-on-surface relative z-10 transition-colors duration-300" data-type="facture" onclick="switchType(this, 0)">Facture</button>
<button class="type-btn flex-1 flex items-center justify-center text-label-md font-label-md text-on-surface-variant relative z-10 transition-colors duration-300" data-type="devis" onclick="switchType(this, 1)">Devis</button>
</div>
<!-- Client Section -->
<div class="flex flex-col gap-4 bg-surface-container-low p-5 rounded-[20px] shadow-[0_8px_32px_rgba(0,0,0,0.02)] border-t border-white/60 relative overflow-hidden glass-effect">
<div class="absolute inset-0 bg-gradient-to-br from-primary-fixed/20 to-transparent opacity-50 pointer-events-none"></div>
<h2 class="text-title-md font-title-md text-on-surface relative z-10">Client</h2>
<div class="relative z-10">
<label class="text-label-md text-on-surface-variant font-label-md mb-1 block">Sélectionner un client</label>
<div class="flex items-center bg-surface-container-lowest/40 backdrop-blur-md rounded-lg h-14 px-4 shadow-inner relative focus-within:ring-1 focus-within:ring-primary transition-all">
<span class="material-symbols-outlined text-outline mr-3">person_search</span>
<input class="bg-transparent w-full h-full outline-none text-body-lg text-on-surface font-body-lg placeholder:text-outline-variant" placeholder="Rechercher..." type="text"/>
<button class="ml-2 w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">add</span>
</button>
</div>
</div>
</div>
<!-- Articles Section -->
<div class="flex flex-col gap-4 bg-surface-container-low p-5 rounded-[20px] shadow-[0_8px_32px_rgba(0,0,0,0.02)] border-t border-white/60 relative overflow-hidden glass-effect">
<div class="absolute inset-0 bg-gradient-to-br from-secondary-fixed/20 to-transparent opacity-50 pointer-events-none"></div>
<div class="flex items-center justify-between relative z-10">
<h2 class="text-title-md font-title-md text-on-surface">Articles</h2>
<button class="text-primary text-label-md font-label-md flex items-center gap-1 bg-primary/10 px-3 py-1.5 rounded-full" onclick="addLineItem()">
<span class="material-symbols-outlined text-[16px]">add</span> Ajouter
            </button>
</div>
<div class="w-full overflow-x-auto relative z-10 -mx-5 px-5 hide-scrollbar">
<table class="w-full min-w-[500px] text-left border-collapse" id="articles-table">
<thead>
<tr class="text-label-md text-on-surface-variant font-label-md border-b border-surface-variant">
<th class="py-3 font-normal">Désignation</th>
<th class="py-3 font-normal w-20">Qté</th>
<th class="py-3 font-normal w-28 text-right">PU HT</th>
<th class="py-3 font-normal w-32 text-right">Total HT</th>
<th class="py-3 w-10"></th>
</tr>
</thead>
<tbody id="line-items-container">
<!-- Lines added via JS -->
</tbody>
</table>
</div>
</div>
<!-- Paramètres Section -->
<div class="flex flex-col gap-4 bg-surface-container-low p-5 rounded-[20px] shadow-[0_8px_32px_rgba(0,0,0,0.02)] border-t border-white/60 relative overflow-hidden glass-effect">
<h2 class="text-title-md font-title-md text-on-surface relative z-10">Paramètres</h2>
<div class="grid grid-cols-2 gap-4 relative z-10">
<div>
<label class="text-label-md text-on-surface-variant font-label-md mb-1 block">TVA (%)</label>
<div class="bg-surface-container-lowest/40 backdrop-blur-md rounded-lg h-12 px-3 flex items-center shadow-inner">
<input class="bg-transparent w-full outline-none text-body-lg text-on-surface font-body-lg" id="tva-input" oninput="calculateTotals()" type="number" value="18"/>
</div>
</div>
<div>
<label class="text-label-md text-on-surface-variant font-label-md mb-1 block">Remise (%)</label>
<div class="bg-surface-container-lowest/40 backdrop-blur-md rounded-lg h-12 px-3 flex items-center shadow-inner">
<input class="bg-transparent w-full outline-none text-body-lg text-on-surface font-body-lg" id="discount-input" oninput="calculateTotals()" type="number" value="0"/>
</div>
</div>
<div class="col-span-2">
<label class="text-label-md text-on-surface-variant font-label-md mb-1 block">Frais de livraison (FCFA)</label>
<div class="bg-surface-container-lowest/40 backdrop-blur-md rounded-lg h-12 px-3 flex items-center shadow-inner">
<input class="bg-transparent w-full outline-none text-body-lg text-on-surface font-body-lg" id="delivery-input" oninput="calculateTotals()" type="number" value="0"/>
</div>
</div>
</div>
<div class="relative z-10 mt-2">
<label class="text-label-md text-on-surface-variant font-label-md mb-1 block">Notes / Conditions</label>
<textarea class="bg-surface-container-lowest/40 backdrop-blur-md rounded-lg w-full p-3 min-h-[80px] outline-none text-body-md text-on-surface font-body-md shadow-inner resize-none placeholder:text-outline-variant" placeholder="Ex: Paiement à 30 jours..."></textarea>
</div>
</div>
<!-- Récapitulatif -->
<div class="flex flex-col gap-3 bg-surface-container-highest p-6 rounded-[24px] shadow-sm relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-tr from-primary/10 to-transparent pointer-events-none"></div>
<h2 class="text-title-md font-title-md text-on-surface relative z-10 mb-2">Récapitulatif</h2>
<div class="flex justify-between items-center text-body-md text-on-surface-variant font-body-md relative z-10">
<span>Total HT</span>
<span class="font-medium text-on-surface" id="subtotal-display">0 FCFA</span>
</div>
<div class="flex justify-between items-center text-body-md text-on-surface-variant font-body-md relative z-10">
<span>Remise (<span id="discount-percent-display">0</span>%)</span>
<span class="font-medium text-error" id="discount-display">- 0 FCFA</span>
</div>
<div class="flex justify-between items-center text-body-md text-on-surface-variant font-body-md relative z-10">
<span>TVA (<span id="tva-percent-display">18</span>%)</span>
<span class="font-medium text-on-surface" id="tva-display">0 FCFA</span>
</div>
<div class="flex justify-between items-center text-body-md text-on-surface-variant font-body-md relative z-10">
<span>Livraison</span>
<span class="font-medium text-on-surface" id="delivery-display">0 FCFA</span>
</div>
<div class="w-full h-px bg-outline-variant/30 my-2 relative z-10"></div>
<div class="flex justify-between items-end relative z-10">
<span class="text-title-md text-on-surface font-title-md">TOTAL TTC</span>
<div class="flex flex-col items-end">
<span class="text-headline-lg-mobile text-primary font-headline-lg-mobile font-bold tracking-tight" id="total-ttc-display">0 FCFA</span>
</div>
</div>
</div>
<!-- Floating Action Button Area (Sticky Bottom) -->
<div class="fixed bottom-0 left-0 w-full p-container-padding bg-gradient-to-t from-background via-background to-transparent z-40 pb-safe">
<button class="w-full h-14 rounded-full bg-gradient-to-r from-primary to-secondary text-on-primary font-title-md text-title-md shadow-lg flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all">
<span class="material-symbols-outlined">save</span>
            Enregistrer
        </button>
</div>
<style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
<script>
        // Tab Switching
        function switchType(btn, index) {
            const indicator = document.getElementById('type-indicator');
            const btns = document.querySelectorAll('.type-btn');
            
            indicator.style.transform = `translateX(${index * 100}%)`;
            
            btns.forEach(b => {
                b.classList.remove('text-on-surface');
                b.classList.add('text-on-surface-variant');
            });
            btn.classList.add('text-on-surface');
            btn.classList.remove('text-on-surface-variant');
        }

        // Invoice Logic
        let lineItemCount = 0;

        function addLineItem(name = '', qty = 1, price = 0) {
            const container = document.getElementById('line-items-container');
            const tr = document.createElement('tr');
            tr.className = 'border-b border-surface-variant/50 last:border-0 group hover:bg-surface-container-highest/20 transition-colors';
            tr.dataset.id = lineItemCount;
            
            tr.innerHTML = `
                <td class="py-2 pr-2">
                    <input type="text" class="w-full bg-transparent outline-none text-body-md text-on-surface placeholder:text-outline-variant line-name" placeholder="Article..." value="${name}">
                </td>
                <td class="py-2 px-2">
                    <input type="number" class="w-full bg-surface-container-lowest/50 backdrop-blur-sm rounded px-2 py-1 outline-none text-body-md text-on-surface text-center line-qty" value="${qty}" min="1" oninput="updateLineTotal(this)">
                </td>
                <td class="py-2 px-2 text-right">
                    <input type="number" class="w-full bg-surface-container-lowest/50 backdrop-blur-sm rounded px-2 py-1 outline-none text-body-md text-on-surface text-right line-price" value="${price}" min="0" oninput="updateLineTotal(this)">
                </td>
                <td class="py-2 pl-2 text-right text-body-md text-on-surface font-medium line-total-display">
                    0
                </td>
                <td class="py-2 text-right">
                    <button class="text-error/70 hover:text-error p-1 rounded-full hover:bg-error-container/50 transition-colors" onclick="removeLine(this)">
                        <span class="material-symbols-outlined text-[20px]">close</span>
                    </button>
                </td>
            `;
            container.appendChild(tr);
            lineItemCount++;
            updateLineTotal(tr.querySelector('.line-qty')); // Trigger initial calc
        }

        function removeLine(btn) {
            const tr = btn.closest('tr');
            tr.remove();
            calculateTotals();
        }

        function updateLineTotal(input) {
            const tr = input.closest('tr');
            const qty = parseFloat(tr.querySelector('.line-qty').value) || 0;
            const price = parseFloat(tr.querySelector('.line-price').value) || 0;
            const total = qty * price;
            
            tr.querySelector('.line-total-display').textContent = formatCurrency(total);
            tr.dataset.total = total;
            calculateTotals();
        }

        function calculateTotals() {
            let subtotal = 0;
            document.querySelectorAll('#line-items-container tr').forEach(tr => {
                subtotal += parseFloat(tr.dataset.total || 0);
            });

            const tvaPercent = parseFloat(document.getElementById('tva-input').value) || 0;
            const discountPercent = parseFloat(document.getElementById('discount-input').value) || 0;
            const delivery = parseFloat(document.getElementById('delivery-input').value) || 0;

            const discountAmount = subtotal * (discountPercent / 100);
            const baseTVA = subtotal - discountAmount;
            const tvaAmount = baseTVA * (tvaPercent / 100);
            
            const totalTTC = baseTVA + tvaAmount + delivery;

            // Update displays
            document.getElementById('subtotal-display').textContent = formatCurrency(subtotal);
            document.getElementById('discount-percent-display').textContent = discountPercent;
            document.getElementById('discount-display').textContent = '- ' + formatCurrency(discountAmount);
            document.getElementById('tva-percent-display').textContent = tvaPercent;
            document.getElementById('tva-display').textContent = formatCurrency(tvaAmount);
            document.getElementById('delivery-display').textContent = formatCurrency(delivery);
            
            // Animate total change
            const totalDisplay = document.getElementById('total-ttc-display');
            totalDisplay.style.transform = 'scale(1.05)';
            totalDisplay.style.opacity = '0.7';
            setTimeout(() => {
                totalDisplay.textContent = formatCurrency(totalTTC);
                totalDisplay.style.transform = 'scale(1)';
                totalDisplay.style.opacity = '1';
            }, 150);
            totalDisplay.style.transition = 'all 0.2s ease-out';
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 }).format(amount) + ' FCFA';
        }

        // Initialize with one empty line
        document.addEventListener('DOMContentLoaded', () => {
            addLineItem('Consulting IT', 1, 150000);
            addLineItem('Frais de dossier', 1, 25000);
        });
    </script>
</div></main></body></html>
