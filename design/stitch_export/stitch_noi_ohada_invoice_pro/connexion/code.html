<html lang="fr"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&amp;display=swap" rel="stylesheet"/>

xl": ["Roboto Flex"], "title-md": ["Roboto Flex"], "body-lg": ["Roboto Flex"], "headline-lg-mobile": ["Roboto Flex"], "headline-lg": ["Roboto Flex"] }, "fontSize": { "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-xl": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800" }], "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }], "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }] } } } };</script></head><body class="bg-background font-body-md min-h-screen flex flex-col justify-center px-container-padding"><div class="flex flex-col w-full relative overflow-hidden py-12 justify-center items-center">
<!-- Decorative Ambient Glow (Glassmorphism backdrop support) -->
<div class="absolute top-0 left-[-20%] w-[70vw] h-[70vw] rounded-full bg-primary-container/10 blur-[80px] pointer-events-none"></div>
<div class="absolute bottom-0 right-[-20%] w-[60vw] h-[60vw] rounded-full bg-secondary-container/10 blur-[80px] pointer-events-none"></div>
<!-- Main Login Container (GlassCard) -->
<div class="relative z-10 flex flex-col w-full max-w-md p-container-padding bg-surface-container-lowest/40 backdrop-blur-[16px] shadow-[0_8px_32px_rgba(0,0,0,0.06)] rounded-[20px] shadow-[inset_0_1px_0_rgba(255,255,255,0.7)]">
<!-- Logo & Header -->
<div class="flex flex-col items-center mb-8" id="login-header" style="opacity: 0; transform: scale(0.95); transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);">
<img alt="Logo NOI OHADA Invoice Pro" class="w-[76px] h-[76px] rounded-full mb-5 shadow-[0_4px_16px_rgba(67,56,202,0.15)] ring-4 ring-surface-container-lowest/50" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCevokFTsxTx1AkQ_PIXsTx6b7vDSAcvUAYBHSIyuem6iBMaispR7xT1c2YPpVL6mZm8baE3EuYxhaXoB58axZNldSdnh86EgLXRmaXrpCREp6IE9KhTprOiN3IxivdwRIXqiAWXErgE7HXJFqK0LfLsNHL6pAeUvlVavbfiEJGP-MZqnABywaAhAVnAgDxM2F03VEVCPzwUaT9VvJGMENH7qJV_0smdcRe0y5VL9GTvNe1B_2l7vkEag"/>
<h1 class="text-headline-lg-mobile font-headline-lg-mobile text-on-surface text-center tracking-tight">OHADA Invoice Pro</h1>
<p class="text-body-md font-body-md text-on-surface-variant text-center mt-1.5 opacity-80">Facturation conforme SYSCOHADA</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-5">
<!-- Email (Floating Label) -->
<div class="relative bg-surface-container-lowest/50 rounded-xl shadow-[inset_0_0_0_1px_rgba(119,117,134,0.25)] focus-within:shadow-[inset_0_0_0_1.5px_rgba(42,20,180,0.8)] transition-all duration-200 flex items-center px-4 h-[60px] group">
<span class="material-symbols-outlined text-on-surface-variant/70 mr-3 group-focus-within:text-primary transition-colors">mail</span>
<div class="relative flex-1 h-full">
<input class="peer w-full h-full bg-transparent text-body-lg font-body-lg text-on-surface outline-none pt-4 pb-1 placeholder-transparent" id="email" placeholder="Adresse e-mail" required="" type="email"/>
<label class="absolute left-0 top-1/2 -translate-y-1/2 text-body-md font-body-md text-on-surface-variant/70 transition-all duration-200 peer-focus:top-[14px] peer-focus:text-[11px] peer-focus:text-primary peer-focus:font-semibold peer-[:not(:placeholder-shown)]:top-[14px] peer-[:not(:placeholder-shown)]:text-[11px] peer-[:not(:placeholder-shown)]:text-on-surface-variant pointer-events-none" for="email">Adresse e-mail</label>
</div>
</div>
<!-- Password (Floating Label + Toggle) -->
<div class="relative bg-surface-container-lowest/50 rounded-xl shadow-[inset_0_0_0_1px_rgba(119,117,134,0.25)] focus-within:shadow-[inset_0_0_0_1.5px_rgba(42,20,180,0.8)] transition-all duration-200 flex items-center px-4 h-[60px] group">
<span class="material-symbols-outlined text-on-surface-variant/70 mr-3 group-focus-within:text-primary transition-colors">lock</span>
<div class="relative flex-1 h-full">
<input class="peer w-full h-full bg-transparent text-body-lg font-body-lg text-on-surface outline-none pt-4 pb-1 placeholder-transparent" id="pwd" placeholder="Mot de passe" required="" type="password"/>
<label class="absolute left-0 top-1/2 -translate-y-1/2 text-body-md font-body-md text-on-surface-variant/70 transition-all duration-200 peer-focus:top-[14px] peer-focus:text-[11px] peer-focus:text-primary peer-focus:font-semibold peer-[:not(:placeholder-shown)]:top-[14px] peer-[:not(:placeholder-shown)]:text-[11px] peer-[:not(:placeholder-shown)]:text-on-surface-variant pointer-events-none" for="pwd">Mot de passe</label>
</div>
<button class="p-1 -mr-1 text-on-surface-variant/70 hover:text-primary transition-colors flex items-center justify-center rounded-full hover:bg-surface-variant/50" id="togglePwd" type="button">
<span class="material-symbols-outlined text-[20px]" id="pwdIcon">visibility</span>
</button>
</div>
<!-- Options -->
<div class="flex items-center justify-between mt-1 mb-2 px-1">
<label class="flex items-center gap-2.5 cursor-pointer group">
<!-- Custom Checkbox -->
<div class="w-[18px] h-[18px] rounded-[4px] flex items-center justify-center shadow-[inset_0_0_0_1.5px_rgba(119,117,134,0.5)] group-hover:shadow-[inset_0_0_0_1.5px_rgba(42,20,180,0.5)] group-has-[:checked]:shadow-none group-has-[:checked]:bg-primary transition-all duration-200">
<input class="sr-only peer" type="checkbox"/>
<span class="material-symbols-outlined text-on-primary text-[14px] opacity-0 peer-checked:opacity-100 transition-opacity" style="font-variation-settings: 'wght' 600;">check</span>
</div>
<span class="text-body-md font-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Se souvenir de moi</span>
</label>
<a class="text-label-md font-label-md text-primary hover:text-primary-fixed-variant transition-colors hover:underline underline-offset-2" href="#">Mot de passe oublié ?</a>
</div>
<!-- Primary Button -->
<button class="fade-in-btn w-full bg-gradient-to-r from-[#4338CA] to-[#7C3AED] text-on-primary text-title-md font-title-md py-[14px] rounded-[14px] shadow-[0_4px_14px_rgba(67,56,202,0.3)] hover:shadow-[0_6px_20px_rgba(67,56,202,0.4)] hover:brightness-110 active:scale-[0.98] transition-all duration-300 flex justify-center items-center" style="opacity: 0; transform: translateY(10px);" type="submit">
        Se connecter
      </button>
</form>
<!-- Divider -->
<div class="flex items-center justify-center my-7 gap-4 opacity-70">
<div class="flex-1 h-[1px] bg-gradient-to-r from-transparent via-outline-variant/60 to-outline-variant/60"></div>
<span class="text-label-md font-label-md text-on-surface-variant uppercase tracking-wider">ou</span>
<div class="flex-1 h-[1px] bg-gradient-to-l from-transparent via-outline-variant/60 to-outline-variant/60"></div>
</div>
<!-- Google Login -->
<button class="fade-in-btn w-full flex items-center justify-center gap-3 bg-surface-container-lowest/60 backdrop-blur-md text-body-md font-body-md font-medium text-on-surface py-3.5 rounded-xl shadow-[inset_0_0_0_1px_rgba(119,117,134,0.2)] hover:bg-surface-container-lowest/90 hover:shadow-[0_2px_8px_rgba(0,0,0,0.04)] active:scale-[0.98] transition-all duration-200" style="opacity: 0; transform: translateY(10px);" type="button">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25C22.56 11.47 22.49 10.72 22.36 10H12V14.26H17.92C17.67 15.63 16.89 16.81 15.72 17.58V20.34H19.29C21.37 18.42 22.56 15.6 22.56 12.25Z" fill="#4285F4"></path>
<path d="M12 23C14.97 23 17.46 22.02 19.29 20.34L15.72 17.58C14.73 18.25 13.48 18.64 12 18.64C9.13 18.64 6.7 16.7 5.83 14.12H2.15V16.97C3.96 20.57 7.69 23 12 23Z" fill="#34A853"></path>
<path d="M5.83 14.12C5.6 13.43 5.47 12.72 5.47 12C5.47 11.28 5.6 10.57 5.83 9.88V7.03H2.15C1.41 8.52 1 10.2 1 12C1 13.8 1.41 15.48 2.15 16.97L5.83 14.12Z" fill="#FBBC05"></path>
<path d="M12 5.36C13.62 5.36 15.07 5.92 16.21 7.01L19.37 3.85C17.45 2.05 14.97 1 12 1C7.69 1 3.96 3.43 2.15 7.03L5.83 9.88C6.7 7.3 9.13 5.36 12 5.36Z" fill="#EA4335"></path>
</svg>
      Continuer avec Google
    </button>
<!-- Sign Up Link -->
<div class="mt-8 text-center fade-in-btn" style="opacity: 0; transform: translateY(10px);">
<span class="text-body-md font-body-md text-on-surface-variant">Nouveau sur OHADA Invoice Pro ?</span>
<a class="text-body-md font-body-md text-primary font-semibold ml-1 hover:text-primary-fixed-variant hover:underline underline-offset-2 transition-all" href="#">S'inscrire</a>
</div>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Entrance Animations
    setTimeout(() => {
      const header = document.getElementById('login-header');
      if (header) {
        header.style.opacity = '1';
        header.style.transform = 'scale(1)';
      }
    }, 50);

    const fadeBtns = document.querySelectorAll('.fade-in-btn');
    fadeBtns.forEach((btn, index) => {
      setTimeout(() => {
        btn.style.transition = 'all 0.5s cubic-bezier(0.16, 1, 0.3, 1)';
        btn.style.opacity = '1';
        btn.style.transform = 'translateY(0)';
      }, 150 + (index * 100));
    });

    // Password Visibility Toggle
    const toggle = document.getElementById('togglePwd');
    const input = document.getElementById('pwd');
    const icon = document.getElementById('pwdIcon');
    
    if (toggle && input && icon) {
      toggle.addEventListener('click', () => {
        if (input.type === 'password') {
          input.type = 'text';
          icon.textContent = 'visibility_off';
        } else {
          input.type = 'password';
          icon.textContent = 'visibility';
        }
      });
    }
  });
</script></body></html>
