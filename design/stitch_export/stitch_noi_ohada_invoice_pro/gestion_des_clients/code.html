<script>
  // Simple search filter logic for demonstration
  const searchInput = document.querySelector('input[type="text"]');
  const clientCards = document.querySelectorAll('#client-list button');
  const emptyState = document.getElementById('empty-state');
  const clientList = document.getElementById('client-list');

  searchInput.addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase();
    let visibleCount = 0;

    clientCards.forEach(card => {
      const name = card.querySelector('h3').textContent.toLowerCase();
      const info = card.querySelector('p').textContent.toLowerCase();
      
      if (name.includes(term) || info.includes(term)) {
        card.style.display = 'flex';
        visibleCount++;
      } else {
        card.style.display = 'none';
      }
    });

    if (visibleCount === 0) {
        clientList.classList.add('hidden');
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
    } else {
        clientList.classList.remove('hidden');
        emptyState.classList.add('hidden');
        emptyState.classList.remove('flex');
    }
  });
