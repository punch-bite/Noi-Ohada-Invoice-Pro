<div class="flex justify-between mb-2">

<div class="h-3 w-1/4 bg-surface-container-high rounded"></div>
</div>

<div class="w-full h-px bg-outline-variant mt-4 mb-2"></div>
<div class="flex justify-between">

<div class="w-12 h-1.5 bg-outline-variant/50 rounded-full mx-auto -mt-3 mb-2"></div>
<!-- Upload Button -->
<button class="w-full py-4 rounded-[14px] bg-gradient-to-r from-primary to-secondary text-on-primary font-label-md text-[14px] flex items-center justify-center gap-2 shadow-lg active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined text-[20px]">add_photo_alternate</span>
      Uploader un arrière-plan
    </button>
<!-- Controls -->
<div class="flex flex-col gap-4">
<!-- Opacity Slider -->
<div class="flex flex-col gap-2">

<span class="font-body-md text-on-surface" id="opacity-val">50%</span>
</div>
<input class="w-full h-1.5 bg-surface-variant rounded-lg appearance-none cursor-pointer accent-primary" id="opacity-slider" max="100" min="0" type="range" value="50"/>
</div>
<!-- Blur Slider -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-on-surface-variant">Flou (Blur)</label>
<span class="font-body-md text-on-surface" id="blur-val">2px</span>
</div>
<input class="w-full h-1.5 bg-surface-variant rounded-lg appearance-none cursor-pointer accent-primary" id="blur-slider" max="20" min="0" type="range" value="2"/>
</div>
<!-- Fit Options -->
<div class="flex gap-2 p-1 bg-surface-container rounded-xl">
<button class="flex-1 py-2 rounded-lg bg-surface shadow-sm text-primary font-label-md transition-colors" id="btn-cover">
          Remplir
        </button>
<button class="flex-1 py-2 rounded-lg text-on-surface-variant font-label-md hover:bg-surface/50 transition-colors" id="btn-contain">
          Ajuster
        </button>
</div>
</div>
<!-- Actions -->
<div class="flex gap-3 mt-2 mb-4">
<button class="flex-1 py-3 rounded-xl bg-surface-container-high text-on-surface font-label-md active:bg-surface-container-highest transition-colors">
        Annuler
      </button>
<button class="flex-[2] py-3 rounded-xl bg-primary text-on-primary font-label-md shadow-md active:bg-primary-container active:text-on-primary-container transition-colors">
        Appliquer
      </button>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const bg = document.getElementById('preview-bg');
      
      const opacitySlider = document.getElementById('opacity-slider');
      const opacityVal = document.getElementById('opacity-val');
      
      const blurSlider = document.getElementById('blur-slider');
      const blurVal = document.getElementById('blur-val');
      
      const btnCover = document.getElementById('btn-cover');
      const btnContain = document.getElementById('btn-contain');

      opacitySlider.addEventListener('input', (e) => {
        const val = e.target.value;
        opacityVal.textContent = `${val}%`;
        bg.style.opacity = val / 100;
      });

      blurSlider.addEventListener('input', (e) => {
        const val = e.target.value;
        blurVal.textContent = `${val}px`;
        bg.style.filter = `blur(${val}px)`;
      });

      btnCover.addEventListener('click', () => {
        bg.classList.remove('bg-contain');
        bg.classList.add('bg-cover');
        btnCover.classList.add('bg-surface', 'shadow-sm', 'text-primary');
        btnCover.classList.remove('text-on-surface-variant');
        btnContain.classList.remove('bg-surface', 'shadow-sm', 'text-primary');
        btnContain.classList.add('text-on-surface-variant');
      });

      btnContain.addEventListener('click', () => {
        bg.classList.remove('bg-cover');
        bg.classList.add('bg-contain', 'bg-no-repeat');
        btnContain.classList.add('bg-surface', 'shadow-sm', 'text-primary');
        btnContain.classList.remove('text-on-surface-variant');
        btnCover.classList.remove('bg-surface', 'shadow-sm', 'text-primary');
        btnCover.classList.add('text-on-surface-variant');
      });
    });
  </script>
