<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Application de facturation NOI OHADA.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NOI OHADA Invoice Pro">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>NOI OHADA Invoice Pro — Factures conformes OHADA</title>
  <link rel="manifest" href="manifest.json">
  <style id="splash-screen-style">
    :root {
      --text: #FFFFFF;
      --text-dim: rgba(255, 255, 255, 0.72);
      --gold: #E9B949;
      --glass: rgba(255, 255, 255, 0.08);
      --glass-line: rgba(255, 255, 255, 0.16);
    }

    html {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
      color: var(--text);
      overflow: hidden;
      background:
        radial-gradient(1100px 620px at 18% -12%, rgba(124, 58, 237, 0.42), transparent 62%),
        radial-gradient(900px 500px at 108% 112%, rgba(233, 185, 73, 0.20), transparent 55%),
        linear-gradient(150deg, #1A237E 0%, #4338CA 46%, #6D28D9 100%);
      background-attachment: fixed;
    }

    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
      padding: 32px;
      text-align: center;
    }

    /* Halo décoratif « respiration » derrière le logo */
    #splash::before {
      content: "";
      position: absolute;
      width: min(64vmin, 460px);
      height: min(64vmin, 460px);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.38), transparent 62%);
      filter: blur(10px);
      animation: breathe 3.4s ease-in-out infinite;
      pointer-events: none;
    }

    #splash-branding {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: rise 0.9s cubic-bezier(0.22, 0.9, 0.36, 1) both;
    }

    .logo-wrap {
      position: relative;
      width: 116px;
      height: 116px;
      border-radius: 32px;
      display: grid;
      place-items: center;
      background: var(--glass);
      border: 1px solid var(--glass-line);
      box-shadow:
        0 26px 64px rgba(0, 0, 0, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .logo-wrap img {
      width: 78px;
      height: 78px;
      object-fit: contain;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.35));
      animation: float 3.2s ease-in-out infinite;
    }

    .title {
      margin: 0;
      font-size: clamp(1.5rem, 5vw, 2.05rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .title .gold {
      color: var(--gold);
    }

    .subtitle {
      margin: 0;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .loader {
      position: relative;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .loader .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #FFFFFF;
      opacity: 0.4;
      animation: blink 1.25s ease-in-out infinite;
    }

    .loader .dot:nth-child(2) { animation-delay: 0.16s; }
    .loader .dot:nth-child(3) { animation-delay: 0.32s; }

    @keyframes blink {
      0%, 100% { opacity: 0.25; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-6px); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.65; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.1); }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>

<body>
  <div id="splash" role="status" aria-label="Chargement de NOI OHADA Invoice Pro">
    <div id="splash-branding">
      <div class="logo-wrap">
        <picture>
          <source
            srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x"
            media="(prefers-color-scheme: dark)">
          <img
            src="splash/img/light-1x.png"
            srcset="splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x"
            alt="" width="78" height="78" aria-hidden="true">
        </picture>
      </div>
      <h1 class="title">NOI OHADA <span class="gold">Invoice Pro</span></h1>
      <p class="subtitle">Facturation conforme OHADA</p>
    </div>

    <div class="loader" aria-hidden="true">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async=""></script>


</body>

</html>
