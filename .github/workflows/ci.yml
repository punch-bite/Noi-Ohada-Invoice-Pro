name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Analyse statique
  # ─────────────────────────────────────────────────────────────
  analyze:
    name: 🔍 Analyse statique (flutter analyze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ☕ Configuration Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 📦 Dépendances
        run: flutter pub get

      - name: 🔍 Analyse
        run: flutter analyze --fatal-infos

  # ─────────────────────────────────────────────────────────────
  # 2. Tests unitaires / widgets
  # ─────────────────────────────────────────────────────────────
  test:
    name: 🧪 Tests (flutter test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ☕ Configuration Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 📦 Dépendances
        run: flutter pub get

      - name: 🧪 Exécution des tests
        run: flutter test --coverage

      - name: 📊 Rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # 3. Build Web
  # ─────────────────────────────────────────────────────────────
  build_web:
    name: 🌐 Build Web
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4

      - name: ☕ Configuration Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 📦 Dépendances
        run: flutter pub get

      - name: 🌐 Compilation web (release)
        run: flutter build web --release

      - name: 📤 Artifact web
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: build/web
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # 4. Build iOS (sans signature — prêt pour TestFlight/Ad Hoc)
  #    NB : le Podfile n'est pas versionné → régénéré par flutter create.
  # ─────────────────────────────────────────────────────────────
  build_ios:
    name: 🍎 Build iOS (no codesign)
    # macOS 15 = Xcode 16+ requis par firebase-ios-sdk 12 (Swift 'sending').
    runs-on: macos-15
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4

      - name: ☕ Configuration Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 📦 Dépendances
        run: flutter pub get

      - name: 🔧 Régénération des fichiers de plateforme iOS manquants
        run: flutter create --platforms=ios --org com.noi --project-name noi_ohada_invoice_pro .

      - name: 🍎 Compilation iOS (release, sans signature)
        run: flutter build ios --release --no-codesign

      - name: 📦 Préparation du .app pour l'installation sideload
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry ios-release.zip Payload

      - name: 📤 Artifact iOS
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-no-codesign
          path: build/ios/iphoneos/ios-release.zip
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # 5. Déploiement Web → VERCEL (branche main uniquement, opt-in)
  #    Prérequis (Settings du dépôt) :
  #      - Variable  DEPLOY_WEB_VERCEL = true (Variables → Actions)
  #      - Secrets   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
  #    (ids du projet Vercel STATIQUE de la web-app, pas du serveur API)
  # ─────────────────────────────────────────────────────────────
  deploy_web_vercel:
    name: 🚀 Déploiement Web → Vercel
    runs-on: ubuntu-latest
    needs: [build_web]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_WEB_VERCEL == 'true'
    steps:
      - name: ⬇️ Récupération de l'artifact web
        uses: actions/download-artifact@v4
        with:
          name: web-release
          path: build/web

      - name: 🚀 Déploiement sur Vercel (prod)
        run: |
          npx --yes vercel@latest deploy build/web --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
