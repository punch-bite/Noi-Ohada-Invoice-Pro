name: Build & Publish Android Release

# =============================================================
# Build l'APK + l'AAB signés (keystore de production) et publie
# automatiquement une GitHub Release à chaque tag vX.Y.Z
# (ex. v1.0.0) ou via le bouton « Run workflow ».
#
# ⚠️ SECRETS REQUIS (Settings → Secrets and variables → Actions) :
#   KEYSTORE_BASE64   → cat android/app/upload-keystore.jks | base64
#   KEYSTORE_PASSWORD → mot de passe du keystore
#   KEY_ALIAS         → alias de la clé de signature (ex. upload)
#   KEY_PASSWORD      → mot de passe de la clé
#   (optionnel) API_SECRET_KEY → clot l'accès si votre serveur le demande
#
# NB : aucun secret n'est embarqué dans le dépôt. Le keystore est
# lu depuis github secrets et jamais commité (déjà ignoré par .gitignore).
# =============================================================

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Nom du tag/version pour créer la release (ex. v1.0.0). Optionnel si déclenché par un push sur tag."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: "Build & publish release"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------------- Préparation Android SDK ----------------
      # build.gradle.kts exige : platforms 36, NDK 28.2.13676358, API 37.
      # Sur les runners ubuntu-latest, le NDK n'est pas toujours installé →
      # l'erreur « NDK ... did not have a source.properties file » (build échoue).
      - name: 🔧 Vérifier/installer platforms Android & NDK
        run: |
          # Localiser `sdkmanager` (pas toujours dans le PATH sur les runners GitHub)
          if ! command -v sdkmanager >/dev/null 2>&1; then
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$PATH"
          fi
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --list_installed 2>/dev/null | grep -q "platforms;android-36" || sdkmanager "platforms;android-36"
          sdkmanager --list_installed 2>/dev/null | grep -q "platforms;android-37" || sdkmanager "platforms;android-37"
          # NDK requis par build.gradle.kts (ndkVersion 28.2.13676358)
          if ! [ -d "$ANDROID_HOME/ndk/28.2.13676358" ] || ! [ -f "$ANDROID_HOME/ndk/28.2.13676358/source.properties" ]; then
            echo "📥 Installation du NDK 28.2.13676358..."
            yes | sdkmanager "ndk;28.2.13676358"
          fi
          echo "NDK installé :"
          ls "$ANDROID_HOME/ndk/" 2>/dev/null
          # Symlink API 37 si seulement "android-37.0" est installé (runner CodeMagic)
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            ln -sf "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      # ---------------- Flutter ----------------
      - name: ☕ Configuration Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 📦 Dépendances
        run: flutter pub get

      # ---------------- Environnement (aide au diagnostic) ----------------
      # Placé juste après l'installation Flutter : disponible même si un des
      # builds échoue ensuite (pour relire les versions dans le step summary).
      - name: 🧰 Snapshot de l'environnement de build
        run: |
          {
            echo "### 🧰 Environnement de build"
            echo '```'
            echo "flutter : $(flutter --version 2>/dev/null | head -1 || echo n/a)"
            echo "NDK installés : $(ls "$ANDROID_HOME/ndk/" 2>/dev/null | tr '\n' ' ' || echo aucun)"
            echo "platforms    : $(ls "$ANDROID_HOME/platforms/" 2>/dev/null | tr '\n' ' ' || echo aucun)"
            echo "build-tools  : $(ls "$ANDROID_HOME/build-tools/" 2>/dev/null | tr '\n' ' ' || echo aucun)"
            echo "java         : $(java -version 2>&1 | head -1 || echo n/a)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🔍 Analyse (non bloquante)
        continue-on-error: true
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      # ---------------- Keystore + signature ----------------
      # NB : on ne peut PAS utiliser `if: ${{ secrets.X != '' }}` (GitHub
      # interdit les secrets dans les conditions `if` → workflow invalide).
      # On gère donc la présence des secrets directement dans le script.
      - name: 🔐 Décoder le keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
            echo "✅ Keystore écrit dans $RUNNER_TEMP/upload-keystore.jks"
          else
            echo "⚠️ Secret KEYSTORE_BASE64 absent — build en signature DEBUG (non publiable)."
          fi

      - name: 🔐 Injecter les infos de signature dans local.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ] && [ -f "$RUNNER_TEMP/upload-keystore.jks" ]; then
            {
              echo "sdk.dir=$ANDROID_HOME"
              echo "flutter.sdk=$(dirname "$(dirname "$(command -v flutter)")")"
              echo "release.keystore.storeFile=$RUNNER_TEMP/upload-keystore.jks"
              echo "release.keystore.password=$KEYSTORE_PASSWORD"
              echo "release.key.alias=$KEY_ALIAS"
              echo "release.key.password=$KEY_PASSWORD"
            } > android/local.properties
            echo "✅ local.properties configuré pour signature RELEASE :"
            # On affiche sans révéler les secrets (chemins + clés uniquement).
            grep -vE 'password=|key.alias=|key.password=' android/local.properties
            echo "  (mots de passe et alias masqués)"
          else
            echo "⚠️ Signatures incomplètes — le build utilisera la signature DEBUG."
          fi

      # ---------------- Build ----------------
      - name: 🏗️ Build APK (release, obfusqué)
        env:
          API_BASE_URL: "https://server-xi-two-23.vercel.app"
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
        run: |
          set -o pipefail
          LOG=/tmp/apk_build.log
          DEFINES="--dart-define=API_BASE_URL=$API_BASE_URL"
          if [ -n "$API_SECRET_KEY" ]; then
            DEFINES="$DEFINES --dart-define=API_SECRET_KEY=$API_SECRET_KEY"
          fi
          if ! flutter build apk --release \
            --android-skip-build-dependency-validation \
            $DEFINES \
            --obfuscate \
            --split-debug-info=build/symbols/apk \
            2>&1 | tee "$LOG"; then
            {
              echo "## ❌ Échec du build APK"
              echo ""
              echo "### 🧭 Candidats les plus probables"
              echo ""
              # On cherche en priorité la 1re « Failure/Error » et son contexte.
              echo '```'
              grep -nE "What went wrong|Caused by:|FAILURE: Build failed|Exception" "$LOG" | head -8 || true
              echo '```'
              echo ""
              echo "### 📋 Extrait de l'erreur (avec contexte)"
              echo '```'
              # -> première ligne d'erreur + 3 lignes avant/après pour le contexte
              line=$(grep -nE "What went wrong|Caused by:|error:|Error:|FAILURE|ndk|NDK|cMake|cmake|source.properties|failed" "$LOG" \
                | head -1 | cut -d: -f1)
              if [ -n "$line" ] && [ "$line" -gt 0 ] 2>/dev/null; then
                start=$((line - 3)); [ "$start" -lt 1 ] && start=1
                sed -n "${start},$((line + 20))p" "$LOG"
              else
                grep -E "error:|Error:|What went wrong|Caused by:|.*failed" "$LOG" | tail -40 || true
              fi
              echo '```'
              echo ""
              echo "### 🏷️ Catégories d'erreurs détectées"
              echo '```'
              echo "- erreurs    : $(grep -cE 'Error:|error:' "$LOG" || true)"
              echo "- gradle     : $(grep -cE 'What went wrong|FAILURE' "$LOG" || true)"
              echo "- ndk/cmake  : $(grep -cE 'ndk|NDK|cMake|cmake|source.properties' "$LOG" || true)"
              echo "- cpp        : $(grep -cE 'Undefined|undefined method|no member named|is not a member' "$LOG" || true)"
              echo '```'
              echo ""
              echo '_Le log complet est joint en artefact `build-logs-diagnostic` (etape ci-dessous). La racine du probleme est generalement visible dans les premieres lignes ci-dessus._'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### ✅ Build APK OK" >> "$GITHUB_STEP_SUMMARY"

      - name: 🏗️ Build AAB (release, signé)
        env:
          API_BASE_URL: https://server-xi-two-23.vercel.app
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
        run: |
          set -o pipefail
          LOG=/tmp/aab_build.log
          DEFINES="--dart-define=API_BASE_URL=$API_BASE_URL"
          if [ -n "$API_SECRET_KEY" ]; then
            DEFINES="$DEFINES --dart-define=API_SECRET_KEY=$API_SECRET_KEY"
          fi
          if ! flutter build appbundle --release \
            --android-skip-build-dependency-validation \
            $DEFINES \
            --obfuscate \
            --split-debug-info=build/symbols/aab \
            2>&1 | tee "$LOG"; then
            {
              echo "## ❌ Échec du build AAB"
              echo ""
              echo "### 🧭 Candidats les plus probables"
              echo '```'
              grep -nE "What went wrong|Caused by:|FAILURE: Build failed|Exception" "$LOG" | head -8 || true
              echo '```'
              echo ""
              echo "### 📋 Extrait de l'erreur (avec contexte)"
              echo '```'
              line=$(grep -nE "error:|Error:|What went wrong|Caused by:|.*failed" "$LOG" \
                | head -1 | cut -d: -f1)
              if [ -n "$line" ] && [ "$line" -gt 0 ] 2>/dev/null; then
                start=$((line - 3)); [ "$start" -lt 1 ] && start=1
                sed -n "${start},$((line + 20))p" "$LOG"
              else
                grep -E "error:|Error:|What went wrong|Caused by:|.*failed" "$LOG" | tail -40 || true
              fi
              echo '```'
              echo ""
              echo '_Le log complet est joint en artefact `build-logs-diagnostic` (étape ci-dessous)._'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### ✅ Build AAB OK" >> "$GITHUB_STEP_SUMMARY"

      # ---------------- Logs de build (artefact, même en cas d'échec) ----
      - name: 📦 Upload des logs de build (diagnostic)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-diagnostic
          path: |
            /tmp/apk_build.log
            /tmp/aab_build.log
          if-no-files-found: warn
          retention-days: 14

      - name: ✅ Vérifier la signature
        run: |
          ls -la build/app/outputs/flutter-apk/
          echo "---"
          # `file` et `apksigner` sont parfois indisponibles ; on ne bloque pas
          # la publication si la vérification échoue.
          (command -v apksigner >/dev/null 2>&1 && \
            $ANDROID_HOME/build-tools/*/apksigner verify --print-certs \
            build/app/outputs/flutter-apk/*.apk) || echo "Vérification de signature non exécutée"

      # ---------------- Publication ----------------
      - name: 📦 Créer la GitHub Release + artefacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: Noi OHADA Invoice Pro – Release ${{ inputs.tag_name || github.ref_name }}
          body: |
            ## 📱 Noi OHADA Invoice Pro

            > [!NOTE]
            > Ceci est une **release intermédiaire** publiée en attendant la
            > validation de l'accès Google Play Console.

            ### 📦 Contenu
            - **APK** (installation directe sur Android) — signature de prod
            - **AAB** (bundle à soumettre au Play Store)
            - **Symboles** de désobfuscation (facultatif, pour lire les crashs)

            ### 🛠️ Installation (testeurs)
            1. Télécharger le fichier `.apk`
            2. L'ouvrir sur un appareil Android (autoriser « sources inconnues »)
            3. L'application s'installe ; les données restent accessibles via le compte

            ---
            *Généré automatiquement par GitHub Actions.*
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
            build/symbols/**
          # ⚠️ draft/prerelease = false : la page /download (server/download.js)
          # interroge l'API `releases/latest`, qui IGNORE les drafts et les
          # prereleases. Pour que le bouton Android soit relié à l'APK, la
          # release doit être publiée officiellement.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}