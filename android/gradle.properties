# Mémoire calibrée pour machine 7 Go RAM (cf. hs_err_pid*.log : OOM du
# C2 CompilerThread du daemon Gradle + du Java LS VS Code simultanés).
# -Xmx1536m         : plafonne le tas du daemon Gradle (au lieu de 2048m).
# -XX:TieredStopAtLevel=1 : JIT C1 uniquement → pas de threads C2 (ceux qui
#                     ont crashé), empreinte mémoire bien plus faible.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError -XX:TieredStopAtLevel=1 -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
# Limite le nombre de workers concurrents (4 cœurs / 7 Go RAM).
org.gradle.workers.max=2
org.gradle.caching=true
# Plafonne le JVM du compilateur Kotlin (daemon séparé du daemon Gradle).
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -XX:TieredStopAtLevel=1
org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio\\jbr
android.useAndroidX=true
android.newDsl=false

# Note: The old creator is deprecated, AGP 8+ uses the new zipflinger/apkzlib by default
android.builder.useNewApkCreator=true

android.ignoreDefaultNdkVersion=true
android.disableNdk=true